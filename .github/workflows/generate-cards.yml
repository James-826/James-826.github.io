name: Generate Review Cards

on:
  push:
    branches: [master]
    paths:
      - "src/content/posts/**"
  workflow_dispatch:
    inputs:
      slug:
        description: "指定文章 slug（留空 = 自动检测本次推送的文章）"
        required: false
        default: ""
      force:
        description: "重新生成并覆盖该文章已有的卡片"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

env:
  SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
  LEDGER_DISPATCH_TOKEN: ${{ secrets.LEDGER_DISPATCH_TOKEN }}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate cards from posts
        if: env.SENSENOVA_API_KEY != ''
        run: |
          ARGS=""
          if [ -n "${{ inputs.slug }}" ]; then ARGS="${{ inputs.slug }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          node scripts/generate-cards.mjs $ARGS
      - name: Commit generated cards
        id: commit
        if: env.SENSENOVA_API_KEY != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/cards
          if git diff --cached --quiet; then
            echo "没有新卡片生成，无需提交。"
          else
            git commit -m "feat: 自动生成复习卡片"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Pages deploy
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml -R "$GITHUB_REPOSITORY"
      - name: Notify ledger
        if: steps.commit.outputs.committed == 'true' && env.LEDGER_DISPATCH_TOKEN != ''
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${LEDGER_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/James-826/project-ledger/dispatches \
            -d '{"event_type":"ledger-update"}'
name: Notify Ledger

on:
  push:
    branches: [main, master]
    paths:
      - "src/content/**"
      - "public/admin/**"
      - "src/pages/**"
      - "src/config.ts"
      - "astro.config.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ledger AI summary
        if: ${{ secrets.LEDGER_DISPATCH_TOKEN != '' }}
        env:
          TOKEN: ${{ secrets.LEDGER_DISPATCH_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/James-826/project-ledger/dispatches \
            -d '{"event_type":"ledger-update"}'